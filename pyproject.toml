[project]
name = "datawatch-hacs"
version = "0.1.0"
description = "Home Assistant integration for datawatch."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "dmz006" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.0", "pytest-cov>=7.0"]
lint = ["ruff>=0.17", "mypy>=2.4"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.coverage.run]
source = ["custom_components/datawatch", "scripts"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
files = ["custom_components/datawatch", "scripts"]
strict = true
